# Deploy the chat app to GitHub Pages (static host + Supabase backend)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify static site files
        run: |
          test -f Chatting_updated/public/index.html
          test -f Chatting_updated/public/client.js
          test -f Chatting_updated/public/supabase-client.js
          test -f Chatting_updated/public/mobile.css
          ls -la Chatting_updated/public

      - name: Stamp build id
        run: |
          BUILD="${GITHUB_SHA::12}"
          echo "stamping build $BUILD"
          sed -i "s/__BUILD__/$BUILD/g" Chatting_updated/public/index.html
          printf '{"build":"%s"}\n' "$BUILD" > Chatting_updated/public/version.json
          grep -o 'name="ptr29-build" content="[^"]*"' Chatting_updated/public/index.html
          cat Chatting_updated/public/version.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./Chatting_updated/public
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
